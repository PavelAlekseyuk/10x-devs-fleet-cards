name: Clean up old workflow runs

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: cleanup-workflow-runs
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out cleanup policy
        uses: actions/checkout@v5

      - name: Delete old completed runs
        uses: actions/github-script@v7
        with:
          script: |
            const { selectRunsForDeletion } = require('./scripts/select-workflow-runs.cjs');
            const { owner, repo } = context.repo;
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner,
              repo,
              per_page: 100,
            });
            const selected = selectRunsForDeletion(runs, Date.now());
            core.info(`Found ${runs.length} runs; deleting ${selected.length} old completed runs.`);
            for (const run of selected) {
              core.info(`Deleting run ${run.id} from workflow ${run.workflow_id} (${run.created_at}).`);
              await github.rest.actions.deleteWorkflowRun({ owner, repo, run_id: run.id });
            }
